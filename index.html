<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SmartCart V2</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
}

#homeScreen{
  position:fixed;
  inset:0;

  background:
  linear-gradient(
    rgba(0,0,0,.5),
    rgba(0,0,0,.7)
  ),
  url("fundo.jpg");

  background-size:cover;
  background-position:center;

  display:flex;
  justify-content:center;
  align-items:center;
}

.overlay{
  text-align:center;
  backdrop-filter:blur(5px);
  padding:40px;
  border-radius:25px;
  background:rgba(0,0,0,0.25);
}

.home-logo{
  width:220px;
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{
    filter:drop-shadow(0 0 10px #08d8ff);
  }

  to{
    filter:drop-shadow(0 0 25px #08d8ff);
  }
}

.overlay h1{
  color:white;
  font-size:55px;
  margin:20px 0 10px;
}

.overlay p{
  color:#d5e8ff;
  font-size:20px;
  margin-bottom:35px;
}

.start-btn{
  padding:16px 45px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#08d8ff,#087dff);
  color:white;
  font-size:20px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

.start-btn:hover{
  transform:scale(1.05);
  box-shadow:0 0 25px #08d8ff;
}
</style>

</head>
<body>

<div id="homeScreen">
  <div class="overlay">
    <img src="logo.png" alt="SmartCart" class="home-logo">

    <h1>SMARTCART V2</h1>

    <p>
      Controle seu carrinho de forma simples e inteligente
    </p>

    <button id="startBtn" class="start-btn">
      COMEÇAR
    </button>
  </div>
</div>

</body>
</html>
